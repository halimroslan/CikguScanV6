<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-white">
<div class="flex items-start text-black">
    <h1 class="text-3xl font-extrabold tracking-tight relative pr-10">CikguScan
        <svg class="absolute -top-1 right-0 w-8 h-8 text-blue-600" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <mask id="cut-corner">
              <rect x="0" y="0" width="24" height="24" fill="white" />
              <circle cx="19" cy="6" r="6" fill="black" /> <!-- Cutout for sparkle -->
            </mask>
          </defs>
          <rect x="2" y="5" width="16" height="14" rx="4" fill="transparent" stroke="currentColor" stroke-width="2.5" mask="url(#cut-corner)"/>
          <text x="10" y="16" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="11" fill="currentColor" text-anchor="middle" letter-spacing="-0.5">AI</text>
          <path d="M 19,0 C 19,4 21,6 25,6 C 21,6 19,8 19,12 C 19,8 17,6 13,6 C 17,6 19,4 19,0 Z" fill="currentColor"/>
        </svg>
    </h1>
</div>

<div class="flex items-start text-black mt-10">
    <h1 class="text-3xl font-extrabold tracking-tight relative pr-10">CikguScan
        <!-- Filled Version -->
        <svg class="absolute -top-1 right-0 w-8 h-8 text-blue-600" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="5" width="16" height="14" rx="4" fill="currentColor" />
          <text x="10" y="15.5" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="10" fill="white" text-anchor="middle" letter-spacing="-0.5">AI</text>
          <path d="M 19,0 C 19,4 21,6 25,6 C 21,6 19,8 19,12 C 19,8 17,6 13,6 C 17,6 19,4 19,0 Z" fill="currentColor"/>
        </svg>
    </h1>
</div>
</body>
</html>
